<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NutriTrack" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>NutriTrack</title>
  <style>
    :root{--bg:#f7f7f8;--card:#fff;--text:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#111827;--good:#166534;--warn:#9a3412}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 96px)}
    h1,h2,h3,p{margin-top:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.date{font-size:13px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 18px rgba(0,0,0,.03)}
    .kcal{font-size:42px;font-weight:800;letter-spacing:-1.5px}.sub{font-size:14px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:14px;border:1px solid var(--line);border-radius:16px}.metric b{display:block;font-size:19px;margin-top:4px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center}.food{padding:12px 0;border-bottom:1px solid var(--line)}.food:last-child{border-bottom:0}
    button,.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;background:var(--accent);color:white;cursor:pointer}
    .secondary{background:#eceef1;color:#111827}.danger{background:#fee2e2;color:#991b1b}.small{padding:9px 12px;font-size:14px}
    .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);width:min(680px,calc(100% - 32px));z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.18)}
    dialog{width:min(680px,calc(100% - 24px));border:0;border-radius:24px;padding:0;max-height:88vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.35)}
    .sheet{padding:20px}.actions{display:grid;gap:10px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:white}.field textarea{min-height:100px}
    .status{font-size:13px;color:var(--muted);padding:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}.hide{display:none!important}
    progress{width:100%;height:8px;border:0;border-radius:8px;overflow:hidden}progress::-webkit-progress-bar{background:#eceef1}progress::-webkit-progress-value{background:#111827}
    img.preview{width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:#f3f4f6;border:1px solid var(--line)}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="date" id="todayLabel"></div><h1 style="margin-bottom:4px">NutriTrack</h1><div class="sub">个人每日营养记录</div></div><button class="secondary small" id="settingsBtn">目标</button></div>

  <section class="card">
    <div class="sub">今日摄入</div><div class="kcal"><span id="kcalNow">0</span> <span style="font-size:18px">kcal</span></div>
    <div class="sub">目标 <span id="kcalGoal">2000</span> kcal · 剩余 <span id="kcalLeft">2000</span> kcal</div>
    <progress id="kcalProgress" max="2000" value="0"></progress>
  </section>

  <section class="grid">
    <div class="metric"><span class="sub">蛋白质</span><b><span id="proteinNow">0</span> / <span id="proteinGoal">120</span> g</b></div>
    <div class="metric"><span class="sub">碳水</span><b><span id="carbNow">0</span> / <span id="carbGoal">220</span> g</b></div>
    <div class="metric"><span class="sub">脂肪</span><b><span id="fatNow">0</span> / <span id="fatGoal">65</span> g</b></div>
    <div class="metric"><span class="sub">膳食纤维</span><b><span id="fiberNow">0</span> / <span id="fiberGoal">30</span> g</b></div>
  </section>

  <section class="card"><div class="row"><h2 style="font-size:20px;margin:0">今日记录</h2><button class="secondary small" id="clearTodayBtn">清空今日</button></div><div id="foodList" style="margin-top:8px"></div></section>
</div>
<button class="fab" id="addBtn">＋ 添加食品</button>

<dialog id="addDialog"><div class="sheet"><div class="row"><h2>添加食品</h2><button class="secondary small close">关闭</button></div>
  <div class="actions">
    <button id="scanLabelBtn">从相册识别营养成分表</button>
    <button class="secondary" id="manualBtn">手动添加</button>
  </div>
  <input id="imageInput" type="file" accept="image/*" class="hide" />
  <div id="ocrArea" class="hide">
    <div class="field"><label>图片</label><img class="preview" id="preview" alt="营养标签预览"></div>
    <div class="status" id="ocrStatus">准备识别…</div>
    <div class="field"><label>OCR 原始文本（可直接修改）</label><textarea id="ocrText"></textarea></div>
    <button class="secondary" id="parseBtn">重新解析文本</button>
  </div>
  <div id="foodForm" class="hide">
    <div class="field"><label>食品名称</label><input id="foodName" placeholder="例如：燕麦片"></div>
    <div class="field"><label>营养基准</label><select id="basis"><option value="100">每 100g / 100ml</option><option value="serving">每份</option></select></div>
    <div class="grid">
      <div class="field"><label>热量 kcal</label><input id="kcal" type="number" inputmode="decimal"></div>
      <div class="field"><label>蛋白质 g</label><input id="protein" type="number" inputmode="decimal"></div>
      <div class="field"><label>碳水 g</label><input id="carbs" type="number" inputmode="decimal"></div>
      <div class="field"><label>脂肪 g</label><input id="fat" type="number" inputmode="decimal"></div>
      <div class="field"><label>纤维 g</label><input id="fiber" type="number" inputmode="decimal"></div>
      <div class="field"><label>糖 g</label><input id="sugar" type="number" inputmode="decimal"></div>
      <div class="field"><label>钠 mg</label><input id="sodium" type="number" inputmode="decimal"></div>
    </div>
    <div class="field"><label id="amountLabel">本次吃了多少 g / ml</label><input id="amount" type="number" inputmode="decimal" value="100"></div>
    <div class="field"><label>餐次</label><select id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>加餐</option></select></div>
    <button id="saveFoodBtn">加入今日</button>
  </div>
</div></dialog>

<dialog id="settingsDialog"><div class="sheet"><div class="row"><h2>每日目标</h2><button class="secondary small close">关闭</button></div>
  <div class="field"><label>热量 kcal</label><input id="goalKcal" type="number"></div>
  <div class="field"><label>蛋白质 g</label><input id="goalProtein" type="number"></div>
  <div class="field"><label>碳水 g</label><input id="goalCarbs" type="number"></div>
  <div class="field"><label>脂肪 g</label><input id="goalFat" type="number"></div>
  <div class="field"><label>膳食纤维 g</label><input id="goalFiber" type="number"></div>
  <button id="saveGoalsBtn">保存目标</button>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const dateKey=()=>new Date().toISOString().slice(0,10);
const defaultGoals={kcal:2000,protein:120,carbs:220,fat:65,fiber:30};
const goals=()=>({...defaultGoals,...JSON.parse(localStorage.getItem('nutriGoals')||'{}')});
const entries=()=>JSON.parse(localStorage.getItem('nutriEntries')||'{}');
const saveEntries=v=>localStorage.setItem('nutriEntries',JSON.stringify(v));
const n=v=>Number(v)||0; const round=v=>Math.round((v+Number.EPSILON)*10)/10;
function todayEntries(){return entries()[dateKey()]||[]}
function render(){
  const d=new Date(); $('#todayLabel').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  const g=goals(), list=todayEntries(); const t=list.reduce((a,x)=>({kcal:a.kcal+x.kcal,protein:a.protein+x.protein,carbs:a.carbs+x.carbs,fat:a.fat+x.fat,fiber:a.fiber+x.fiber}),{kcal:0,protein:0,carbs:0,fat:0,fiber:0});
  ['kcal','protein','carbs','fat','fiber'].forEach(k=>{$('#'+(k==='carbs'?'carb':k)+'Now').textContent=round(t[k]); $('#'+(k==='carbs'?'carb':k)+'Goal').textContent=g[k]});
  $('#kcalLeft').textContent=Math.max(0,round(g.kcal-t.kcal)); $('#kcalProgress').max=g.kcal; $('#kcalProgress').value=t.kcal;
  const box=$('#foodList'); box.innerHTML='';
  if(!list.length){box.innerHTML='<p class="sub" style="margin:14px 0 0">今天还没有记录。</p>'; return}
  const groups={}; list.forEach((x,i)=>(groups[x.meal]??=[]).push({...x,_i:i}));
  Object.entries(groups).forEach(([meal,items])=>{const h=document.createElement('div');h.innerHTML=`<h3 style="margin:16px 0 4px">${meal}</h3>`;box.appendChild(h);items.forEach(x=>{const r=document.createElement('div');r.className='food row';r.innerHTML=`<div><b>${x.name||'未命名食品'}</b><div class="sub">P ${round(x.protein)}g · C ${round(x.carbs)}g · F ${round(x.fat)}g</div></div><div style="text-align:right"><b>${round(x.kcal)} kcal</b><br><button class="secondary small" data-del="${x._i}">删除</button></div>`;box.appendChild(r)})});
  $$('[data-del]').forEach(b=>b.onclick=()=>{const all=entries();all[dateKey()].splice(+b.dataset.del,1);saveEntries(all);render()});
}
function resetForm(){['foodName','kcal','protein','carbs','fat','fiber','sugar','sodium'].forEach(id=>$('#'+id).value='');$('#amount').value='100';$('#basis').value='100';$('#ocrArea').classList.add('hide');$('#foodForm').classList.add('hide');}
$('#addBtn').onclick=()=>{resetForm();$('#addDialog').showModal()};
$$('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#manualBtn').onclick=()=>{$('#foodForm').classList.remove('hide')};
$('#scanLabelBtn').onclick=()=>$('#imageInput').click();
$('#basis').onchange=()=>{$('#amountLabel').textContent=$('#basis').value==='100'?'本次吃了多少 g / ml':'本次吃了多少份'; if($('#basis').value==='serving' && $('#amount').value==='100') $('#amount').value='1'};
$('#imageInput').onchange=async e=>{
 const file=e.target.files[0]; if(!file)return; $('#ocrArea').classList.remove('hide'); $('#foodForm').classList.remove('hide'); $('#preview').src=URL.createObjectURL(file); $('#ocrStatus').textContent='正在本机浏览器中识别文字…首次使用会加载 OCR 模型。';
 try{const res=await Tesseract.recognize(file,'eng+chi_sim',{logger:m=>{if(m.progress)$('#ocrStatus').textContent=`OCR ${Math.round(m.progress*100)}% · ${m.status}`}});$('#ocrText').value=res.data.text;parseNutrition(res.data.text);$('#ocrStatus').textContent='识别完成，请核对数值后保存。'}catch(err){$('#ocrStatus').textContent='OCR 未完成。你仍可手动填写，或检查网络后重试。';console.error(err)}
};
function findNum(text,patterns){for(const p of patterns){const m=text.match(p);if(m)return n(String(m[1]).replace(',','.'))}return 0}
function parseNutrition(text){
 const s=text.replace(/\r/g,' ').replace(/[：:]/g,':');
 let kcal=findNum(s,[/(?:energy|calories|热量|能量)[^\n]{0,30}?(\d+(?:[\.,]\d+)?)\s*kcal/i,/(\d+(?:[\.,]\d+)?)\s*kcal/i]);
 if(!kcal){const kj=findNum(s,[/(?:energy|能量)[^\n]{0,30}?(\d+(?:[\.,]\d+)?)\s*kj/i,/(\d+(?:[\.,]\d+)?)\s*kj/i]); if(kj) kcal=round(kj/4.184)}
 const vals={kcal,protein:findNum(s,[/(?:protein|蛋白质)[^\n\d]{0,12}(\d+(?:[\.,]\d+)?)/i]),carbs:findNum(s,[/(?:carbohydrate|carbohydrates|碳水化合物|碳水)[^\n\d]{0,16}(\d+(?:[\.,]\d+)?)/i]),fat:findNum(s,[/(?:total fat|fat|脂肪)[^\n\d]{0,12}(\d+(?:[\.,]\d+)?)/i]),fiber:findNum(s,[/(?:dietary fiber|fibre|fiber|膳食纤维)[^\n\d]{0,16}(\d+(?:[\.,]\d+)?)/i]),sugar:findNum(s,[/(?:sugars|sugar|糖)[^\n\d]{0,12}(\d+(?:[\.,]\d+)?)/i]),sodium:findNum(s,[/(?:sodium|钠)[^\n\d]{0,12}(\d+(?:[\.,]\d+)?)/i])};
 Object.entries(vals).forEach(([k,v])=>$('#'+k).value=v||'');
 if(/per\s*100\s*(g|ml)|每\s*100\s*(克|g|毫升|ml)/i.test(s)){$('#basis').value='100';$('#amount').value='100'} else if(/per\s*serv|每份|serving/i.test(s)){$('#basis').value='serving';$('#amount').value='1'}
}
$('#parseBtn').onclick=()=>parseNutrition($('#ocrText').value);
$('#saveFoodBtn').onclick=()=>{
 const basis=$('#basis').value, amount=n($('#amount').value), factor=basis==='100'?amount/100:amount; if(factor<=0)return alert('请输入实际食用量。');
 const item={name:$('#foodName').value.trim()||'食品',meal:$('#meal').value,amount,basis,kcal:round(n($('#kcal').value)*factor),protein:round(n($('#protein').value)*factor),carbs:round(n($('#carbs').value)*factor),fat:round(n($('#fat').value)*factor),fiber:round(n($('#fiber').value)*factor),sugar:round(n($('#sugar').value)*factor),sodium:round(n($('#sodium').value)*factor),createdAt:Date.now()};
 const all=entries();(all[dateKey()]??=[]).push(item);saveEntries(all);$('#addDialog').close();render();
};
$('#clearTodayBtn').onclick=()=>{if(confirm('确定清空今天所有记录吗？')){const all=entries();delete all[dateKey()];saveEntries(all);render()}};
$('#settingsBtn').onclick=()=>{const g=goals();$('#goalKcal').value=g.kcal;$('#goalProtein').value=g.protein;$('#goalCarbs').value=g.carbs;$('#goalFat').value=g.fat;$('#goalFiber').value=g.fiber;$('#settingsDialog').showModal()};
$('#saveGoalsBtn').onclick=()=>{localStorage.setItem('nutriGoals',JSON.stringify({kcal:n($('#goalKcal').value),protein:n($('#goalProtein').value),carbs:n($('#goalCarbs').value),fat:n($('#goalFat').value),fiber:n($('#goalFiber').value)}));$('#settingsDialog').close();render()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
render();
</script>
</body>
</html>
